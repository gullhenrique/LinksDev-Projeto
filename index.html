<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="Crie uma página única para reunir seus sites, redes sociais, vídeos e contatos."
    />
    <title>LinksDev — Um link para tudo que é seu</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const redirect = sessionStorage.getItem("linksdev-redirect");
      if (redirect) {
        sessionStorage.removeItem("linksdev-redirect");
        history.replaceState(null, "", "/LinksDev-Projeto" + redirect);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
